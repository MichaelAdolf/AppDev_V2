[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockmind"
version = "1.0.0"
description = "SockMind Analysis Platform"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "numpy",
    "sqlalchemy",
    "pydantic",
    "python-dotenv"
]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]